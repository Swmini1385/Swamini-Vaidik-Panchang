<!-- Reusable Location Details Modal -->
<div class="modal fade" id="locationDetailsModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="locationDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden" style="border-top: 5px solid var(--primary-gold) !important;">
            <div class="modal-header bg-white pb-0 border-0">
                <h5 class="modal-title fw-bold text-danger" id="locationDetailsModalLabel">
                    <i class="fa-solid fa-map-location-dot me-2"></i>भौगोलिक माहिती (Location Details)
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="modal-close-btn"></button>
            </div>
            <div class="modal-body pt-3">
                <form id="modalLocationForm" class="needs-validation" novalidate>
                    {% csrf_token %}
                    <input type="hidden" id="modal_location_id" name="id">
                    
                    <div class="row g-2 mb-3">
                        <div class="col-sm-6">
                            <label for="modal_city_village" class="form-label fw-bold small">City/Village *</label>
                            <input type="text" class="form-control form-control-sm" id="modal_city_village" name="city_village" required>
                            <div class="invalid-feedback">Required</div>
                        </div>
                        <div class="col-sm-6">
                            <label for="modal_district" class="form-label fw-bold small">District</label>
                            <input type="text" class="form-control form-control-sm" id="modal_district" name="district">
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-sm-6">
                            <label for="modal_state" class="form-label fw-bold small">State *</label>
                            <input type="text" class="form-control form-control-sm" id="modal_state" name="state" required>
                            <div class="invalid-feedback">Required</div>
                        </div>
                        <div class="col-sm-6">
                            <label for="modal_country" class="form-label fw-bold small">Country *</label>
                            <input type="text" class="form-control form-control-sm" id="modal_country" name="country" value="India" required>
                            <div class="invalid-feedback">Required</div>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-sm-6">
                            <label for="modal_latitude" class="form-label fw-bold small">Latitude *</label>
                            <input type="number" step="0.000001" min="-90" max="90" class="form-control form-control-sm" id="modal_latitude" name="latitude" required>
                            <div class="invalid-feedback">Required (-90 to 90)</div>
                        </div>
                        <div class="col-sm-6">
                            <label for="modal_longitude" class="form-label fw-bold small">Longitude *</label>
                            <input type="number" step="0.000001" min="-180" max="180" class="form-control form-control-sm" id="modal_longitude" name="longitude" required>
                            <div class="invalid-feedback">Required (-180 to 180)</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="modal_timezone" class="form-label fw-bold small">Time Zone *</label>
                        <select class="form-select form-select-sm" id="modal_timezone" name="timezone" required>
                            <option value="" disabled selected>Select Timezone</option>
                            <optgroup label="India & Nearby">
                                <option value="Asia/Kolkata" data-offset="5.5">GMT+05:30 (India / Kolkata)</option>
                                <option value="Asia/Kathmandu" data-offset="5.75">GMT+05:45 (Nepal / Kathmandu)</option>
                                <option value="Asia/Dhaka" data-offset="6.0">GMT+06:00 (Bangladesh / Dhaka)</option>
                                <option value="Asia/Karachi" data-offset="5.0">GMT+05:00 (Pakistan / Karachi)</option>
                                <option value="Asia/Colombo" data-offset="5.5">GMT+05:30 (Sri Lanka / Colombo)</option>
                            </optgroup>
                            <optgroup label="Middle East & Asia">
                                <option value="Asia/Dubai" data-offset="4.0">GMT+04:00 (Dubai / UAE)</option>
                                <option value="Asia/Singapore" data-offset="8.0">GMT+08:00 (Singapore / HK)</option>
                                <option value="Asia/Tokyo" data-offset="9.0">GMT+09:00 (Tokyo / Japan)</option>
                                <option value="Asia/Bangkok" data-offset="7.0">GMT+07:00 (Bangkok / Thailand)</option>
                            </optgroup>
                            <optgroup label="Europe & Americas">
                                <option value="Europe/London" data-offset="0.0">GMT+00:00 (London / UK)</option>
                                <option value="Europe/Paris" data-offset="1.0">GMT+01:00 (Paris / Europe)</option>
                                <option value="America/New_York" data-offset="-5.0">GMT-05:00 (New York / EST)</option>
                                <option value="America/Chicago" data-offset="-6.0">GMT-06:00 (Chicago / CST)</option>
                                <option value="America/Denver" data-offset="-7.0">GMT-07:00 (Denver / MST)</option>
                                <option value="America/Los_Angeles" data-offset="-8.0">GMT-08:00 (Los Angeles / PST)</option>
                                <option value="Pacific/Honolulu" data-offset="-10.0">GMT-10:00 (Honolulu / Hawaii)</option>
                                <option value="Australia/Sydney" data-offset="10.0">GMT+10:00 (Sydney / Australia)</option>
                            </optgroup>
                            <optgroup label="Other Offsets">
                                <option value="Etc/GMT+12" data-offset="-12.0">GMT-12:00</option>
                                <option value="Etc/GMT+11" data-offset="-11.0">GMT-11:00</option>
                                <option value="America/Anchorage" data-offset="-9.0">GMT-09:00</option>
                                <option value="America/Halifax" data-offset="-4.0">GMT-04:00</option>
                                <option value="America/Sao_Paulo" data-offset="-3.0">GMT-03:00</option>
                                <option value="America/Noronha" data-offset="-2.0">GMT-02:00</option>
                                <option value="Atlantic/Cape_Verde" data-offset="-1.0">GMT-01:00</option>
                                <option value="UTC" data-offset="0.0">GMT+00:00</option>
                                <option value="Europe/Kaliningrad" data-offset="2.0">GMT+02:00</option>
                                <option value="Europe/Moscow" data-offset="3.0">GMT+03:00</option>
                                <option value="Asia/Vladivostok" data-offset="11.0">GMT+11:00</option>
                                <option value="Pacific/Auckland" data-offset="12.0">GMT+12:00</option>
                                <option value="Pacific/Fakaofo" data-offset="13.0">GMT+13:00</option>
                                <option value="Pacific/Kiritimati" data-offset="14.0">GMT+14:00</option>
                            </optgroup>
                        </select>
                        <div class="invalid-feedback">Please select a timezone</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light border-0 py-2">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-sm btn-warning fw-bold text-dark px-3" id="saveModalLocationBtn">
                    <i class="fa-solid fa-floppy-disk me-1"></i>Save Location
                </button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const modalForm = document.getElementById("modalLocationForm");
    const saveBtn = document.getElementById("saveModalLocationBtn");
    
    saveBtn.addEventListener("click", function () {
        if (!modalForm.checkValidity()) {
            modalForm.classList.add("was-validated");
            return;
        }
        
        const formData = new FormData(modalForm);
        const locationId = document.getElementById("modal_location_id").value;
        
        let url = "/api/locations/save/";
        if (locationId) {
            // If editing, we can save or update. For simplicity, save will handle both or we can post with id
            formData.append("id", locationId);
        }
        
        // Construct location_name as "city_village" or similar
        const city_village = document.getElementById("modal_city_village").value.trim();
        formData.append("location_name", city_village);
        
        fetch(url, {
            method: "POST",
            body: formData,
            headers: {
                "X-CSRFToken": formData.get("csrfmiddlewaretoken")
            }
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                // Hide modal
                const modalEl = document.getElementById("locationDetailsModal");
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
                
                // Trigger success callback if registered
                if (window.onLocationModalSaveSuccess) {
                    window.onLocationModalSaveSuccess(data, {
                        id: data.id,
                        city_village: document.getElementById("modal_city_village").value,
                        district: document.getElementById("modal_district").value,
                        state: document.getElementById("modal_state").value,
                        country: document.getElementById("modal_country").value,
                        latitude: document.getElementById("modal_latitude").value,
                        longitude: document.getElementById("modal_longitude").value,
                        timezone: document.getElementById("modal_timezone").value
                    });
                }
                
                // Show toast message
                alert(data.message);
            } else {
                alert(data.message);
            }
        })
        .catch(err => {
            console.error("Error saving location:", err);
            alert("Something went wrong while saving location.");
        });
    });
});
</script>
