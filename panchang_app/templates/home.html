{% extends 'base.html' %}
{% load static %}

{% block title %}{{ trans.home }} | {{ trans.app_name }}{% endblock %}

{% block content %}
<div class="hero-section">
    <div class="om-symbol-hero">ॐ</div>
    
    <h1 class="devanagari-title text-warning mb-2" style="font-size: 44px; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4); color: var(--dark-maroon) !important;">
        {{ trans.swami_blessing }}
    </h1>
    
    <h2 class="vedic-title text-muted mb-4" style="font-size: 20px; letter-spacing: 1px;">
        {{ trans.welcome_msg }}
    </h2>
    
    <!-- Swami Samarth Quote Box -->
    <div class="swami-quote-box">
        <i class="fa-solid fa-quote-left me-3" style="color: var(--primary-gold); font-size: 28px;"></i>
        <span>{{ quote }}</span>
        <i class="fa-solid fa-quote-right ms-3" style="color: var(--primary-gold); font-size: 28px;"></i>
    </div>
    
    <p class="lead text-dark max-width-700 mx-auto px-3 mb-5" style="font-size: 16px; max-width: 680px; line-height: 1.8;">
        {{ trans.description_home }}
    </p>
    
    <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center align-items-center">
        <a href="{% url 'login' %}" class="btn btn-lg btn-warning px-5 py-3 text-dark font-weight-bold" style="background: var(--gold-gradient); border: 2px solid var(--primary-gold-dark); border-radius: 50px; font-weight: 600; box-shadow: 0 4px 15px rgba(212, 160, 23, 0.4);">
            <i class="fa-solid fa-sign-in-alt me-2"></i>{{ trans.login_here }}
        </a>
        <a href="{% url 'signup' %}" class="btn btn-lg btn-outline-dark px-5 py-3" style="border: 2px solid var(--dark-maroon); color: var(--dark-maroon); border-radius: 50px; font-weight: 600;">
            <i class="fa-solid fa-user-plus me-2"></i>{{ trans.signup_here }}
        </a>
    </div>
</div>
{% endblock %}
