<!DOCTYPE html>
<html lang="{% if current_lang == 'mr' %}mr{% else %}en{% endif %}">
<head>
    <meta charset="UTF-8">
    <title>Kundali</title>
    <!-- WeasyPrint supports basic CSS, it's better to inline Bootstrap core if possible or link it -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 1.5cm;
            @bottom-center {
                content: "Page " counter(page) " of " counter(pages);
                font-size: 10pt;
                color: gray;
            }
        }
        body { 
            font-family: 'Helvetica', 'Arial', sans-serif; 
            background: #ffffff; 
            color: #333333;
            font-size: 12px;
        }
        .vedic-title { color: #800000; font-weight: bold; }
        .text-warning { color: #d4a017 !important; }
        .text-danger { color: #dc3545 !important; }
        .bg-light { background-color: #f8f9fa !important; }
        .bg-warning { background-color: #ffc107 !important; }
        
        .page-break-before-always { page-break-before: always; }
        
        /* Force all panels to display */
        .tab-panel,
        .dasha-sub-list,
        .dasha-sub-sub-list,
        #pos-tab-nirayan,
        #pos-tab-sayan,
        #chart-d1-container,
        #chart-d9-container { 
            display: block !important; 
            visibility: visible !important;
        }
        
        /* Hide interactive elements */
        .btn,
        .d-print-none,
        .kundali-nav-tabs-bar { 
            display: none !important; 
        }
        
        /* Fix checkboxes for print */
        .shanti-checkbox-item:has(input[type="checkbox"]:not(:checked)) { display: none !important; }
        .shanti-checkbox-item input[type="checkbox"] { display: none !important; }
        .shanti-checkbox-item .form-check { border: none !important; background: none !important; padding: 0 !important; }
        .shanti-checkbox-item .form-check-label::before { content: "• "; color: #198754; font-weight: bold; }
        
        .d-print-block { display: block !important; }
        
        /* Chart SVG fixes */
        svg { max-width: 100%; height: auto; }
        .chart-display-container { max-width: 400px; margin: 0 auto; page-break-inside: avoid; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #dee2e6; padding: 4px; text-align: left; }
        
        .dasha-m-row { page-break-inside: avoid; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container-fluid py-3">
        <h2 class="text-center vedic-title mb-4" style="border-bottom: 2px solid #d4a017; padding-bottom: 10px;">
            {% if current_lang == 'mr' %}वैदिक कुंडली अहवाल{% else %}Vedic Kundali Report{% endif %}
        </h2>
        
        {% include 'kundali_content.html' %}
        
        <div class="text-center mt-5 pt-3" style="border-top: 1px solid #ccc; color: gray; font-size: 10px;">
            {% if current_lang == 'mr' %}
                हा अहवाल स्वामिनी वैदिक पंचांग द्वारे तयार केला आहे.
            {% else %}
                This report was generated by Swamini Vaidik Panchang.
            {% endif %}
        </div>
    </div>
</body>
</html>
